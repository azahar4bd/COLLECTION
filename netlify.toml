[build]
  publish = "dist"
  functions = "dist/netlify/functions"
  command = "rm -rf dist && mkdir -p dist/shared dist/netlify/functions && cp index.html app.js styles.css sw.js manifest.webmanifest package.json package-lock.json netlify.toml dist/ && cp shared/*.js dist/shared/ && cp netlify/functions/* dist/netlify/functions/ && cd dist && npm install --omit=dev --no-package-lock --no-audit --no-fund"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# নতুন ভার্সন প্রকাশের পরে ব্রাউজার পুরোনো app.js/styles.css ক্যাশ করে রাখতে পারত —
# তাই অ্যাসেটে ক্যাশ-বাস্টিং ও কোনো ক্যাশ না রাখার হেডার দেওয়া হলো।
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200
